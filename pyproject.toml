[project]
name = "scout-research"
version = "0.1.0"
description = "AI-gestützter Research-Assistent für Comparable Company Analysis auf Basis von SEC EDGAR"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",  # Golden-Set-Seed (eval/golden_seed.py)
]
agent = [
    "anthropic>=1,<2",  # 1.x: HTTP-Layer httpx2, Python >= 3.10; 1.11.0 am 2026-10-05 veröffentlicht
]
ui = [
    "streamlit>=1.35",
]

[project.scripts]
scout-research = "scout_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scout_research.agent" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not live'"
asyncio_default_fixture_loop_scope = "function"  # O-21: künftiger Default von pytest-asyncio, explizit gesetzt
markers = [
    "live: ruft EDGAR/Finnhub live auf; nicht Teil der Standardsuite (-m live). Live-Aufrufe an das LLM laufen nie über pytest (Netzwerk-Wächter, tests/network_guard.py), nur über CLI/Eval-Runner",
]
