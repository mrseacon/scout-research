[project]
name = "scout-research"
version = "0.1.0"
description = "AI-gestützter Research-Assistent für Comparable Company Analysis auf Basis von SEC EDGAR"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",  # Golden-Set-Seed (eval/golden_seed.py)
]
agent = [
    "anthropic>=1,<2",  # 1.x: HTTP-Layer httpx2, Python >= 3.10; 1.11.0 am 2026-10-05 veröffentlicht
]
ui = [
    "streamlit>=1.35",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not live'"
markers = [
    "live: ruft externe Dienste (LLM, EDGAR, Finnhub) live auf; nicht Teil der Standardsuite (-m live)",
]
