# Prüfkorpus Number-Check (Phase-3-Plan, Abschnitt 11) — Schritt 6, Phase A (Opus, 2026-10-09)
#
# Status: Entwurf. Erwartungen gelten unter den Empfehlungen zu O1–O7 (Plan 11.7). Fälle mit `depends_on`
# werden nach Seans Entscheidung angepasst; alle übrigen sind unabhängig davon.
#
# Felder je Fall:
#   id          eindeutig; Präfix = Gruppe (ST-A akzeptiert, ST-B nackte Zahl, ST-C Slot-Fehler, RA Begründungen,
#               FT freier Text mit typisiertem Abgleich)
#   lang        Sprache des Texts (de|en); muss zur output_language der Session-Variante passen
#   profile     slot_text | rationale | free_text (Plan 11.1)
#   session     Variante aus `session.variants`
#   text        Modelltext (Rohtext, wie eingereicht)
#   expect      accepted | Liste der Problem-Codes (Reihenfolge egal; Aufruf-Code = erstes nach Plan 11.1)
#   findings    erwartete Fundstellen als Ausschnitte des Rohtexts. String = Code ist der einzige in `expect`;
#               sonst {code, match}. Abgleich je Code über Überlappung: jede erwartete Fundstelle überlappt genau
#               ein gemeldetes Problem, jedes gemeldete Problem mindestens eine erwartete Fundstelle.
#               Ein Ausschnitt wird an seinem ersten Vorkommen im Text verortet.
#   rendered    (optional, nur bei accepted) gerenderter Körper ohne Basiszeile, Fußnotentexte und Warnungsblock
#   footnotes   (optional) erwartete Fußnotenmarken in Reihenfolge * † ‡ §
#   category    Kurzname der Klasse (Plan 11.2) bzw. des Angriffs
#   reason      warum das Ergebnis so sein muss
#   depends_on  (optional) offene Entscheidungen, von denen die Erwartung abhängt
#   residual    (optional) true = der Check lässt das bewusst durch (dokumentierte Grenze, Plan 11.2/11.3)
#
# Alle Werte der Sitzung sind synthetisch (keine echten Kennzahlen der genannten Firmen).

version: 1

session:
  # Gilt in allen Varianten: was vor der Tabelle in der Sitzung passiert ist.
  shared:
    user_messages:
      - "Mach mir bitte Comps für Adobe."
      - "Nimm bitte auch Autodesk dazu. Wie hoch war der Umsatz von ADBE im FY2024?"
