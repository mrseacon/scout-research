      - {ticker: CDNS, name: "Cadence Design Systems, Inc.", period_end: "2025-12-31", fiscal_year: 2025, price: 312.4,
         price_as_of: "2026-10-08", revenue: 5230000000, ebit: 1490000000, ebitda: 1700000000,
         ebitda_approximated: true, net_income: 1150000000, total_debt: 2480000000, total_debt_is_lower_bound: true,
         cash: 2640000000, market_cap: 85300000000, enterprise_value: 85140000000, ev_is_lower_bound: true,
         ebit_margin: 0.2849, net_margin: 0.2199, revenue_yoy: 0.1269,
         ev_revenue: 16.2792, ev_ebitda: 50.0824, ev_ebit: 57.1409, pe: 74.1739, excluded: {}}
      - {ticker: WDAY, name: "Workday, Inc.", period_end: "2026-01-31", fiscal_year: 2026, price: 228.9,
         price_as_of: "2026-10-08", revenue: 9550000000, ebit: 640000000, ebitda: null,
         ebitda_approximated: false, net_income: -120000000, total_debt: 3000000000, total_debt_is_lower_bound: false,
         cash: 7200000000, market_cap: 61000000000, enterprise_value: 56800000000, ev_is_lower_bound: false,
         ebit_margin: 0.067, net_margin: -0.0126, revenue_yoy: 0.1618,
         ev_revenue: 5.9476, ev_ebitda: null, ev_ebit: 88.7531, pe: null,
         excluded: {ev_ebitda: "EBITDA nicht verfügbar.", pe: "Net Income nicht positiv; Multiple nicht aussagekräftig."}}
    skipped_peers:
      - {ticker: ADSK, code: REVENUE_NOT_FOUND, reason: "in den Filings wurde kein Umsatz gefunden"}
    statistics:   # über die Peers (ohne Ziel); kompakt in Klammern
      - {multiple: ev_revenue, min: 5.9476, median: 9.6299, mean: 10.26644, max: 16.2792, n: 5,
         excluded: [], lower_bound: [CDNS]}                          # 5,9 / 9,6 / 10,3 / 16,3
      - {multiple: ev_ebitda, min: 20.8087, median: 41.08065, mean: 42.631175, max: 67.5547, n: 4,
         excluded: [WDAY], lower_bound: [CDNS]}                      # 20,8 / 41,1 / 42,6 / 67,6
      - {multiple: ev_ebit, min: 29.9757, median: 57.1409, mean: 62.32676, max: 98.9061, n: 5,
         excluded: [], lower_bound: [CDNS]}                          # 30,0 / 57,1 / 62,3 / 98,9
      - {multiple: pe, min: 39.5161, median: 60.20045, mean: 66.156575, max: 104.7093, n: 4,
         excluded: [WDAY], lower_bound: []}                          # 39,5 / 60,2 / 66,2 / 104,7
    warnings:     # Modellfassung (zahlenfrei)
      - {id: W1, severity: warning, kind: peer_skipped, company: ADSK, field: null}
      - {id: W2, severity: warning, kind: fiscal_year_mismatch, company: INTU, field: period_end}
      - {id: W3, severity: warning, kind: fiscal_year_mismatch, company: CRM, field: period_end}
      - {id: W4, severity: warning, kind: debt_lower_bound, company: CDNS, field: total_debt}
