               sic_description: "Services-Prepackaged Software", period_end: "2025-11-28", fiscal_year: 2025,
               revenue_musd: 21505}
      calendar_year_used: 2025
      frame_check: target_in_frame
      size_range: {min: 0.05, max: 5.0}
      candidates:           # Auszug (counts.returned = 40)
        - {cik: "0000896878", ticker: INTU, name: "Intuit Inc.", sic_code: "7372", revenue_musd: 18831, size_ratio: 0.88}
        - {cik: "0001108524", ticker: CRM, name: "Salesforce, Inc.", sic_code: "7372", revenue_musd: 41200, size_ratio: 1.92}
        - {cik: "0001373715", ticker: NOW, name: "ServiceNow, Inc.", sic_code: "7372", revenue_musd: 13280, size_ratio: 0.62}
        - {cik: "0000813672", ticker: CDNS, name: "Cadence Design Systems, Inc.", sic_code: "7372", revenue_musd: 5230, size_ratio: 0.24}
        - {cik: "0001327811", ticker: WDAY, name: "Workday, Inc.", sic_code: "7372", revenue_musd: 9550, size_ratio: 0.44}
        - {cik: "0000769397", ticker: ADSK, name: "Autodesk, Inc.", sic_code: "7372", revenue_musd: 6131, size_ratio: 0.29}
