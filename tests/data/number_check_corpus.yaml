        - {id: P1, severity: warning, kind: sic_search_truncated, company: Peer-Set, field: null}
    financials:             # volle Werte (USD, Anteile); Kompaktfassung nach payloads.py
      - financials_id: fin_0001
        cik: "0000796343"
        ticker: ADBE
        period_end: "2024-11-29"
        fiscal_year: 2024
        values:
          revenue: {value: 19410000000, accession_number: "0000796343-25-000004"}
          ebit: {value: 6735000000, accession_number: "0000796343-25-000004"}
          net_income: {value: 5428000000, accession_number: "0000796343-25-000004"}
        ebit_margin: 0.34698      # kompakt 34.7
        net_margin: 0.27965       # kompakt 28.0
        revenue_yoy: 0.1082       # kompakt 10.8
      - financials_id: fin_0002
        cik: "0000769397"
        ticker: ADSK
        period_end: "2026-01-31"
        fiscal_year: 2026
        values:
          revenue: {value: 6131000000, accession_number: "0000769397-26-000011"}
          ebit: {value: 1373000000, accession_number: "0000769397-26-000011"}
        ebit_margin: 0.22394      # kompakt 22.4
    market_data:
      - {ticker: ADBE, price: 350.0, price_as_of: "2026-10-08", shares_outstanding_mio: 425.0, market_cap_musd: 148750}
    errors:
      - code: PERIOD_NOT_AVAILABLE
