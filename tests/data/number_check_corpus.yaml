    pre_table_en: {output_language: en, comps_table: false}
    base:         {output_language: de, comps_table: true}
    base_en:      {output_language: en, comps_table: true}
    dates_differ:
      output_language: de
      comps_table: true
      overrides:
        peers.INTU.price_as_of: "2026-10-07"
        basis.price_as_of: null

cases:

  # ===============================================================================================================
  # ST-A — Slot-Text, muss durchgehen (Fehlalarm-Schutz) und richtig rendern
  # ===============================================================================================================

  - id: ST-A01
    lang: de
    profile: slot_text
    session: base
    text: "- Basis: GJ [[basis:target_fiscal_year]], Periodenende [[basis:target_period_end]], Kurs vom [[basis:price_as_of]], [[basis:n_peers]] Peers."
    expect: accepted
    rendered: "- Basis: GJ 2025, Periodenende 28.11.2025, Kurs vom 08.10.2026, 5 Peers."
    category: basis_slots
    reason: "Basisangaben vollständig als Slots; Datum im de-Format, Jahr ohne Präfix."

  - id: ST-A02
    lang: de
    profile: slot_text
    session: base
    text: "ADBE liegt beim EV/EBITDA mit [[co:ADBE:ev_ebitda]] unter dem Peer-Median von [[stat:ev_ebitda:median]]."
    expect: accepted
    rendered: "ADBE liegt beim EV/EBITDA mit 17,0x* unter dem Peer-Median von 41,1x (n = 4)*†‡."
    footnotes: ["*", "†", "‡"]
    category: co_and_stat_slots
    reason: "EBITDA-Marke an Einzelwert und Statistik; Statistik enthält Untergrenze (CDNS) und Ausschluss (WDAY)."

  - id: ST-A03
    lang: de
    profile: slot_text
    session: base
    text: "Die Schuld von CDNS ist nur eine Untergrenze ([[co:CDNS:total_debt]]), siehe [[warn:W4]]."
    expect: accepted
    rendered: "Die Schuld von CDNS ist nur eine Untergrenze (≥ 2.480 Mio. USD), siehe [W4: CDNS]."
    category: lower_bound
    reason: "Untergrenze rendert mit ≥; Warnungs-Marker nennt die Firma."

  - id: ST-A04
    lang: de
    profile: slot_text
    session: base
    text: "Für ADSK enthält das 10-K keinen Umsatz; der Peer fehlt in Tabelle und Statistik [[warn:W1]]."
    expect: accepted
    rendered: "Für ADSK enthält das 10-K keinen Umsatz; der Peer fehlt in Tabelle und Statistik [W1: ADSK]."
    category: form_name
    reason: "Formname mit Bindestrich ist keine Zahl (Klasse 1); übersprungener Peer über Marker adressiert."

  - id: ST-A05
    lang: de
    profile: slot_text
    session: base
    text: |-
      1. Basis siehe oben
      2. Warnungen: [[warn:W2]], [[warn:W3]]
      3. Offene Punkte: Periodengleichheit prüfen
    expect: accepted
    rendered: |-
      1. Basis siehe oben
      2. Warnungen: [W2: INTU], [W3: CRM]
      3. Offene Punkte: Periodengleichheit prüfen
    category: list_marker
    reason: "Listennummern am Zeilenanfang ohne folgende Einheit sind erlaubt (Klasse 3)."

  - id: ST-A06
    lang: de
    profile: slot_text
    session: base
    text: "Siehe W2 und W3: abweichende Geschäftsjahresenden bei INTU und CRM."
    expect: accepted
    category: warning_id
    reason: "Existierende Warnungs-IDs sind Verweise (Klasse 2); zählen aber nicht als Abdeckung."

  - id: ST-A07
    lang: de
    profile: slot_text
    session: base
    text: "Erstens liegt ADBE beim P/E unter dem Median, zweitens auch beim EV/EBIT."
    expect: accepted
    category: enumeration_adverb
    reason: "Aufzählungsadverbien sind keine Rangangabe (Klasse 13)."

  - id: ST-A08
    lang: de
    profile: slot_text
    session: base
    text: "NOW hat das höchste P/E im Peer-Set ([[co:NOW:pe]]), siehe [[warn:W5]]."
    expect: accepted
    rendered: "NOW hat das höchste P/E im Peer-Set (104,7x), siehe [W5: NOW]."
    category: superlative
    reason: "Superlativ ohne Zahl ist Richtungsaussage, kein Zahlenwert (Klasse 13)."

  - id: ST-A09
    lang: de
    profile: slot_text
    session: base
    text: "Bei beiden Peers mit abweichendem Geschäftsjahresende (INTU, CRM) sind die Kennzahlen nicht periodengleich."
    expect: accepted
    category: number_word_allowed
    reason: "„beide“ bezieht sich auf genannte Firmen und ist erlaubt (Klasse 11)."

  - id: ST-A10
    lang: de
    profile: slot_text
    session: base
    text: "Die Mehrheit der Peers liegt beim EV/EBIT über ADBE."
    expect: accepted
    residual: true
    category: qualitative_quantity
    reason: "Qualitative Menge ohne Zahl; Richtigkeit prüft erst der Phase-5-Check für Richtungsaussagen."

  - id: ST-A11
    lang: de
    profile: slot_text
    session: base
    text: "Nichts wurde doppelt gezählt; EBITDA ist überall eine Näherung."
    expect: accepted
    category: fixed_phrase
    reason: "„doppelt gezählt“ ist kein multiplikativer Vergleich (Klasse 14 erfasst nur Vergleichswendungen)."

  - id: ST-A12
    lang: de
    profile: slot_text
    session: base
    text: "Alle Beträge in Mio. USD, Multiples als x, Margen in %."
    expect: accepted
    category: unit_without_number
    reason: "Einheiten-Abkürzungen ohne Zahl sind Bezeichnungen (Klasse 12)."

  - id: ST-A13
    lang: de
    profile: slot_text
    session: base
    text: "Für ADBE ergibt sich ein [[co:ADBE:ev_ebit]]-Multiple unterhalb des Medians."
    expect: accepted
    rendered: "Für ADBE ergibt sich ein 19,0x-Multiple unterhalb des Medians."
    category: slot_adjacency_allowed
    reason: "Bindestrich nach einem Slot ist erlaubt (Nachbarschaftsregel 11.4)."

  - id: ST-A14
    lang: en
    profile: slot_text
    session: base_en
    text: "ADBE trades at [[co:ADBE:pe]] earnings versus a peer median of [[stat:pe:median]]."
    expect: accepted
    rendered: "ADBE trades at 26.8x earnings versus a peer median of 60.2x (n = 4)‡."
    footnotes: ["‡"]
    category: en_format
    reason: "en-Format mit Punkt als Dezimalzeichen; P/E-Statistik ohne WDAY (‡), ohne Untergrenzen."

  - id: ST-A15
    lang: en
    profile: slot_text
    session: base_en
    text: "Scout uses the 10-K only; 10-Q filings are not evaluated."
    expect: accepted
    category: form_name
    reason: "Formnamen mit Bindestrich (Klasse 1)."

  - id: ST-A16
    lang: en
    profile: slot_text
    session: base_en
    text: "Both peers with a different fiscal year end are flagged: [[warn:W2]] and [[warn:W3]]."
    expect: accepted
    rendered: "Both peers with a different fiscal year end are flagged: [W2: INTU] and [W3: CRM]."
    category: number_word_allowed
    reason: "„both“ ist erlaubt (Klasse 11)."

  - id: ST-A17
    lang: en
    profile: slot_text
    session: base_en
    text: "First, the EV/EBITDA statistic excludes WDAY; second, CDNS values are lower bounds."
    expect: accepted
    category: enumeration_adverb
    reason: "Satzeinleitendes „First,“/„second,“ ist Aufzählung, kein Rang (Klasse 13)."

  - id: ST-A18
    lang: de
    profile: slot_text
    session: base
    text: |-
      **Warnungen**
      - [[warn:W5]] NOW: P/E oberhalb der erwarteten Spannbreite.
    expect: accepted
    rendered: |-
      **Warnungen**
      - [W5: NOW] NOW: P/E oberhalb der erwarteten Spannbreite.
    category: markdown
    reason: "Markdown ohne Ziffern ist unkritisch; Marker nach Aufzählungszeichen erlaubt."

  - id: ST-A19
    lang: de
    profile: slot_text
    session: dates_differ
    text: "Kurs INTU [[co:INTU:price]], ADBE [[co:ADBE:price]]."
    expect: accepted
    rendered: "Kurs INTU 640,50 USD (Kurs vom 07.10.2026), ADBE 350,00 USD (Kurs vom 08.10.2026)."
    category: price_date
    reason: "Bei abweichenden Kursdaten bekommt jeder kursabhängige Wert sein Datum (11.4)."

  - id: ST-A20
    lang: de
    profile: slot_text
    session: dates_differ
    text: "Median EV/EBIT der Peers: [[stat:ev_ebit:median]]."
    expect: accepted
    rendered: "Median EV/EBIT der Peers: 57,1x (n = 5)†§."
    footnotes: ["†", "§"]
    category: price_date
    reason: "Kursabhängige Statistik bei abweichenden Kursdaten bekommt §; CDNS-Untergrenze †."

  - id: ST-A21
    lang: de
    profile: slot_text
    session: base
    text: "WDAY: Nettomarge [[co:WDAY:net_margin]], daher kein P/E."
    expect: accepted
    rendered: "WDAY: Nettomarge −1,3 %, daher kein P/E."
    category: negative_value
    reason: "Negatives Vorzeichen setzt der Renderer (U+2212)."

  - id: ST-A22
    lang: de
    profile: slot_text
    session: base
    text: "INTU berichtet für GJ [[co:INTU:fiscal_year]] mit Periodenende [[co:INTU:period_end]]."
    expect: accepted
    rendered: "INTU berichtet für GJ 2025 mit Periodenende 31.07.2025."
    category: fiscal_year_slot
    reason: "Jahr und Datum über Slots statt als nackte Zahl (O2 A)."

  - id: ST-A23
    lang: de
    profile: slot_text
    session: base
    text: "ADBE liegt beim EV/EBITDA bei [[co:INTU:ev_ebitda]]."
    expect: accepted
    rendered: "ADBE liegt beim EV/EBITDA bei 32,1x* (INTU)."
    footnotes: ["*"]
    depends_on: [O6]
    category: attack_slot_wrong_company
    reason: "Gültiger Slot einer anderen Firma; der Number-Check kann die Zuordnung nicht prüfen, das Ticker-Etikett macht sie sichtbar."

  - id: ST-A24
    lang: de
    profile: slot_text
    session: base
    text: "Das EV/EBITDA von ADBE beträgt [[co:ADBE:ev_ebit]]."
    expect: accepted
    rendered: "Das EV/EBITDA von ADBE beträgt 19,0x."
    residual: true
    category: attack_slot_wrong_metric
    reason: "Gültiger Slot mit falscher Kennzahl; nicht deterministisch erkennbar (Phase-5-Kandidat)."

  - id: ST-A25
    lang: de
    profile: slot_text
    session: base
    text: "Das P/E beruht auf [[stat:pe:n]] Peers."
    expect: accepted
    rendered: "Das P/E beruht auf 4 Peers."
    category: stat_n
    reason: "Anzahl als Slot; n-Slot ohne Marken."

  - id: ST-A26
    lang: de
    profile: slot_text
    session: base
    text: "Für WDAY ist EV/EBITDA nicht verfügbar, weil EBITDA nicht ausgewiesen ist."
    expect: accepted
    category: unavailable_text
    reason: "Korrekte Reaktion auf SLOT_VALUE_UNAVAILABLE: „nicht verfügbar“ mit Grund, ohne Zahl."

  - id: ST-A27
    lang: de
    profile: slot_text
    session: base
