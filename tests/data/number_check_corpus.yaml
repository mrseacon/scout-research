    resolved:
      - {query: "Adobe", match: name_exact, cik: "0000796343", ticker: ADBE, name: "Adobe Inc."}
      - {query: "Autodesk", match: name_exact, cik: "0000769397", ticker: ADSK, name: "Autodesk, Inc."}
    candidate_set:          # kompakte Fassung, wie das Modell sie sah
      candidate_set_id: cs_0001
