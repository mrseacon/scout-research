# Golden-Set-Seed MSFT — von Hand aus dem 10-K geprüft (Messlineal, nicht aus dem Extraktor).
# Gepinnt an period_end UND accession_number des 10-K, nicht an "jüngstes 10-K".
# Werte so eintragen, wie sie im 10-K stehen; `unit` gibt die Einheit an (millions | thousands | units),
# die Umrechnung in USD macht eval/golden_seed.py exakt. Ist ein Wert im 10-K nicht ausgewiesen, statt
# `value` einen `absent_reason` setzen (z. B. "kein Gesamt-D&A im Cashflow ausgewiesen").
# `status: complete` erst setzen, wenn alles geprüft ist; `python eval/golden_seed.py` listet die Lücken.
status: skeleton            # skeleton | complete
ticker: MSFT
cik: "0000789019"
form: 10-K
period_end:                 # JJJJ-MM-TT, Geschäftsjahresende laut 10-K
fiscal_year:                # ganze Zahl (DocumentFiscalYearFocus)
accession_number:           # 0000000000-00-000000, das 10-K, aus dem die Werte stammen
checked_by:
checked_on:                 # JJJJ-MM-TT
values:
